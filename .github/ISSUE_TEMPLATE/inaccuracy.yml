name: Inaccuracy
description: The game teaches or shows something that doesn't match real Linux.
labels: [accuracy]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Accuracy reports are some of the most valuable contributions.
  - type: input
    id: where
    attributes:
      label: Where in the game
      placeholder: "Act II level 5, X-ray files view, or a Codex card"
    validations:
      required: true
  - type: textarea
    id: game
    attributes:
      label: What the game does or says
    validations:
      required: true
  - type: textarea
    id: linux
    attributes:
      label: What real Linux does
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Kernel source path and function, documentation link, or man page.
      placeholder: "fs/pipe.c: pipe_write(), or man 2 pipe"
    validations:
      required: true
