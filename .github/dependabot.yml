version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # pnpm workspaces use the npm ecosystem; Dependabot reads pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The scope is written out: `include: scope` would title development updates
    # `build(deps-dev)`, which the PR title check rejects.
    commit-message:
      prefix: "build(deps)"
    # The emulator is upgraded by hand: saved boots and the trace setup depend on its exact
    # version, so a new one means a rebuilt image and re-recorded golden runs.
    ignore:
      - dependency-name: v86
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
