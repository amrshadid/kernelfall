name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request replaces its running check; runs on main always finish, so
# main's status (and the README badge) never shows a cancelled run as failing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: C format
        run: pnpm check:c
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm test
      - name: Content budgets
        run: pnpm content:report
      - name: Build
        run: pnpm build
