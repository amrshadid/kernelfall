name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a running one finishes rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      # Mirror of the pinned Alpine downloads (a release asset), used when Alpine has
      # deleted a superseded package. Unset means the image builds from Alpine alone.
      KF_VM_MIRROR: ${{ vars.KF_VM_MIRROR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Restored after install so pnpm can't clear node_modules/.cache under it.
      - name: Cache the VM image
        id: vm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/public/vm
            node_modules/.cache/kernelfall-vm
          key: vm-image-${{ hashFiles('packages/machine/scripts/vm-image/vm-image.lock.json', 'packages/machine/scripts/vm-image/*.ts', '!packages/machine/scripts/vm-image/*.test.ts', 'packages/machine/src/types/definitions/vm.ts') }}
          restore-keys: vm-image-
      - name: Build the VM image
        if: steps.vm-cache.outputs.cache-hit != 'true'
        run: pnpm vm:image
      - name: Build
        env:
          # "/<repo>/" on a project page, "/" on a user page or custom domain.
          KF_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
