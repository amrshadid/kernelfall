name: PR title

# Pull requests are squash-merged, so the title becomes the commit message on
# main and must follow Conventional Commits (see CONTRIBUTING.md).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            build
            ci
            perf
          scopes: |
            core
            machine
            theme
            game
            levels
            web
            docs
            repo
            ci
            deps
