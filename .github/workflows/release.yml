name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KF_VM_MIRROR: ${{ vars.KF_VM_MIRROR }}
      MIRROR_DIR: node_modules/.cache/kernelfall-vm-mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: C format
        run: pnpm check:c
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm test
      # Keyed on what the image is built from, so a release reuses the last one's downloads.
      - name: Cache the VM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/public/vm
            node_modules/.cache/kernelfall-vm
          key: vm-image-${{ hashFiles('packages/machine/scripts/vm-image/vm-image.lock.json', 'packages/machine/scripts/vm-image/*.ts', '!packages/machine/scripts/vm-image/*.test.ts', 'packages/machine/src/types/definitions/vm.ts') }}
          restore-keys: vm-image-
      # Always a full build here: it also writes every pinned download, flat, for the mirror.
      - name: Build the VM image and its mirror files
        run: pnpm vm:mirror
      - name: Build
        run: pnpm build
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag with a hyphen (v0.1.0-alpha.1) is a pre-release; notes written by hand are kept.
        run: |
          prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $prerelease
      # The image build falls back to .../releases/download/vm-mirror/<file> when Alpine has
      # dropped a pinned package, so the files go to one fixed release, by name.
      - name: Update the vm-mirror release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vm-mirror --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create vm-mirror --repo "$GITHUB_REPOSITORY" --title "VM image mirror" \
              --notes "Pinned Alpine packages, minirootfs and BIOS for the VM image build." --latest=false
          gh release upload vm-mirror "$MIRROR_DIR"/* --repo "$GITHUB_REPOSITORY" --clobber
