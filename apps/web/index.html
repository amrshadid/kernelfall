    <div id="root"></div>
    <!-- The game is drawn by its script. Without it, this says what the game is and where its source is. -->
    <noscript>
      <main style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font: 1rem/1.6 system-ui, sans-serif">
        <h1>Kernelfall</h1>
        <p>Kernelfall is a free, open-source game that teaches Linux kernel development in your browser, starting from zero. You start as a tiny process in a machine that crashed, learn the shell, write your own C, and go down toward the kernel, while X-ray mode shows what the kernel does for every command you run.</p>
        <p>The Machine is real: a Linux kernel running in an emulated PC inside your browser. There is nothing to install and no server, and your progress stays in your browser.</p>
        <p>
          Kernelfall needs JavaScript and a desktop browser. The source is on
          <a href="https://github.com/amrshadid/kernelfall">GitHub</a>, under the MIT license. Made by
          <a href="https://shadid.dev">Amr Shadid</a>.
        </p>
      </main>
    </noscript>
