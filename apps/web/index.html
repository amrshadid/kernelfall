<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A free, open-source game that teaches Linux kernel development from zero, on a real Linux kernel running in your browser. Nothing to install." />
    <meta name="author" content="Amr Shadid" />
    <meta name="theme-color" content="#eeeee9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141514" media="(prefers-color-scheme: dark)" />
    <!-- The drawn icon for browsers; the bitmaps for search results and home screens, which want fixed sizes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" sizes="48x48" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The public site's address, for search engines and for the card a shared link shows.
         These must be absolute, so they name the public site whatever host serves this build. -->
    <link rel="canonical" href="https://kernelfall.shadid.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kernelfall" />
    <meta property="og:url" content="https://kernelfall.shadid.dev/" />
    <meta property="og:title" content="Kernelfall: rebuild a fallen machine" />
    <meta property="og:description" content="A free, open-source game that teaches Linux kernel development from zero, on a real Linux kernel running in your browser. Nothing to install." />
    <meta property="og:image" content="https://kernelfall.shadid.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kernelfall title screen: the name cut by a section line at the Syscall Gate, a New game button, and the Kernel Map of the Prologue" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kernelfall: rebuild a fallen machine" />
    <meta name="twitter:description" content="A free, open-source game that teaches Linux kernel development from zero, on a real Linux kernel running in your browser. Nothing to install." />
    <meta name="twitter:image" content="https://kernelfall.shadid.dev/og.png" />
    <meta name="twitter:image:alt" content="Kernelfall title screen: the name cut by a section line at the Syscall Gate, a New game button, and the Kernel Map of the Prologue" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Kernelfall",
        "url": "https://kernelfall.shadid.dev/",
        "description": "A free, open-source game that teaches Linux kernel development from zero, on a real Linux kernel running in your browser. Nothing to install.",
        "image": "https://kernelfall.shadid.dev/og.png",
        "genre": "Educational",
        "about": "Linux kernel development",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "license": "https://opensource.org/license/mit",
        "sameAs": "https://github.com/amrshadid/kernelfall",
        "author": {
          "@type": "Person",
          "name": "Amr Shadid",
          "url": "https://shadid.dev"
        }
      }
    </script>
    <title>Kernelfall: rebuild a fallen machine</title>
    <script>
      // The theme chosen in Settings, before the first paint, so the loading sheet doesn't flash
      // the other one. Read as savedThemeOf() in shared/utils/not-found reads it.
      try {
        const theme = JSON.parse(localStorage.getItem('kernelfall:v1:settings') || 'null')?.state?.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <style>
      /* The loading sheet: the manual's frame while the game's script arrives. React replaces it. */
      :root { --ground: #eeeee9; --sheet: #fafaf7; --ink: #141414; --ink-2: #55554f; --red: #c8201a; }
      :root[data-theme='dark'] { --ground: #141514; --sheet: #1c1e1d; --ink: #eaeae4; --ink-2: #a3a39b; --red: #ff6a5c; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --ground: #141514; --sheet: #1c1e1d; --ink: #eaeae4; --ink-2: #a3a39b; --red: #ff6a5c; }
      }
      body { margin: 0; background: var(--ground); }
      /* The title screen's frame (ScreenFrame.css, Title.css): a 2.5rem running head, the sheet, a 2rem foot. */
      .boot { box-sizing: border-box; height: 100dvh; min-height: 34rem; padding: 0 1.5rem; display: grid; grid-template-rows: 2.5rem minmax(0, 1fr) 2rem; color: var(--ink); font: 600 0.8125rem/1 Archivo, 'Helvetica Neue', Arial, sans-serif; }
      .boot__head { display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
      .boot__head span:nth-child(2) { text-transform: none; font-weight: 500; font-size: 0.875rem; }
      .boot__sheet { border: 2px solid var(--ink); background: var(--sheet); display: grid; place-content: center; justify-items: center; gap: 1.25rem; }
      .boot__name { font: 800 clamp(2.5rem, 7vw, 5rem)/1 system-ui, sans-serif; letter-spacing: -0.03em; margin: 0; }
      .boot__line { position: relative; width: min(22rem, 60vw); height: 2px; background: repeating-linear-gradient(90deg, var(--ink-2) 0 6px, transparent 6px 10px); overflow: hidden; }
      .boot__line::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 30%; background: var(--red); animation: boot-run 1.4s ease-in-out infinite; }
      .boot__note { color: var(--ink-2); margin: 0; font: 500 0.75rem/1 ui-monospace, 'IBM Plex Mono', Menlo, monospace; }
      @keyframes boot-run { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { .boot__line::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Kernelfall">
        <header class="boot__head" aria-hidden="true">
          <span>Kernelfall(2)</span>
          <span>Kernelfall Service Manual</span>
          <span>Kernelfall(2)</span>
        </header>
        <div class="boot__sheet">
          <p class="boot__name" aria-hidden="true">Kernelfall</p>
          <div class="boot__line" aria-hidden="true"></div>
          <p class="boot__note">Opening the manual…</p>
        </div>
      </div>
    </div>
    <!-- The game is drawn by its script. Without it, this says what the game is and where its source is. -->
    <noscript>
      <main style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font: 1rem/1.6 system-ui, sans-serif">
        <h1>Kernelfall</h1>
        <p>Kernelfall is a free, open-source game that teaches Linux kernel development in your browser, starting from zero. You start as a tiny process in a machine that crashed, learn the shell, write your own C, and go down toward the kernel, while X-ray mode shows what the kernel does for every command you run.</p>
        <p>The Machine is real: a Linux kernel running in an emulated PC inside your browser. There is nothing to install and no server, and your progress stays in your browser.</p>
        <p>
          Kernelfall needs JavaScript and a desktop browser. The source is on
          <a href="https://github.com/amrshadid/kernelfall">GitHub</a>, under the MIT license. Made by
          <a href="https://shadid.dev">Amr Shadid</a>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
