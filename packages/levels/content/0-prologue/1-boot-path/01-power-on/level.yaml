# Prologue P.1, Power On (docs/levels/prologue.md). No code and no syscalls yet: the
# player asks the kernel its name in /proc/version, then walks the file tree from /
# to init's note. The Section drawing's other labels are Codex cards, not lessons;
# /proc as a whole is taught in P.7.
id: prologue-boot-path-01-power-on
title: Power On
summary: "Press the power button, ask the Machine who is in charge, and walk its folders from the top. You learn what the kernel is, what a process is, and how files are arranged."
minutes: 15
tracks: [userland]
skills: [sys-computer-basics]
prerequisites: []
teaches: [kernel, process, file-tree]
uses: []
objectives:
  - id: reads-proc-version
    text: "Ask the kernel who it is: `cat /proc/version`."
    check: { kind: read-to-end, program: cat, path: /proc/version }
  - id: lists-root
    text: "Find the top of the file tree: `ls /`."
    check: { kind: read-to-end, program: ls, path: / }
  - id: reads-motd
    text: "Follow a path down to init's note: `cat /etc/motd`."
    check: { kind: read-to-end, program: cat, path: /etc/motd }
hints:
  - "Each chip is a command: a program's name, then what it should work on. Click it, or type it and press Enter."
  - "A path names the way down from `/`, one folder at a time: `/etc/motd` is the file `motd` inside the folder `etc`."
  - "Three commands, in this order: `cat /proc/version`, `ls /`, `cat /etc/motd`."
chips:
  - { command: cat /proc/version, explain: "ask the kernel its name and version" }
  - { command: ls /, explain: "list the root, the top of the file tree" }
  - { command: cat /etc/motd, explain: "show the file motd in the folder etc: init's note" }
# X-ray's first view unlocks in P.2.
xray: []
codex:
  - id: kernel
    term: the kernel
    simple: >-
      The one program with full control of the hardware; every other program asks it.
      `cat /proc/version` names the Machine's: Linux 6.18.
    deep: >-
      The kernel runs only when something enters it: a program's request, a device
      that needs attention, a timer, a fault. Otherwise the CPU runs programs, the
      kernel's own threads, in brackets in `ps`, or waits in the kernel's idle loop.
      Linux is one kernel; Windows runs NT and macOS runs XNU. Android, Ubuntu and the
      Machine's Alpine all run Linux.
    sources: [arch/x86/entry, init/main.c]
    docs: https://man7.org/linux/man-pages/man2/intro.2.html
    tryIt: uname -r
  - id: proc
    term: /proc, the kernel's window
    simple: >-
      Files no disk holds: the kernel writes each one when a program reads it.
      `cat /proc/version` prints the kernel's version.
    deep: >-
      procfs is a filesystem the kernel generates on each read, mounted at /proc at
      boot. /proc/version comes from fs/proc/version.c. Each running program gets a
      folder, /proc/<pid>, with its memory map, open files and state.
    sources: [fs/proc/version.c, fs/proc/base.c]
    docs: https://man7.org/linux/man-pages/man5/proc.5.html
    tryIt: cat /proc/version; ls /proc/self
  - id: files
    term: the file tree
    simple: >-
      One tree of folders from the root, `/`. A path names the way down: `/etc/motd`
      is the file `motd` in the folder `etc`.
    deep: >-
      Each top folder has one job: /bin and /usr/bin hold programs, /etc settings as
      plain text, /home people's folders, /proc and /sys the kernel's own views, /dev
      devices as files: null swallows what is written to it, zero gives zeros, random
      gives random bytes. A file's details, and where its data is, live in an inode; folders map
      names to inodes. Other filesystems join the tree where they are mounted: /proc
      and /dev are filled by the kernel itself.
    sources: [fs/namei.c, include/linux/fs.h]
    docs: https://man7.org/linux/man-pages/man7/hier.7.html
    tryIt: ls -l /
  - id: computer-parts
    term: the parts of a computer
    simple: >-
      The hardware floor: a CPU runs instructions, memory holds what is running,
      storage keeps files, devices do the rest. The Machine: one CPU, 256 MiB.
    deep: >-
      The CPU reads instructions and data from memory; with one CPU it runs one
      program at a time and switches between them many times a second. Memory forgets
      everything at power off; storage keeps it. Memory is counted in bytes, each a
      number from 0 to 255: 1 MiB is 1,048,576 bytes, so 256 MiB is 268,435,456. Text
      is stored as numbers too: in UTF-8, `h` is 104 and `é` takes two bytes.
    sources: []
    docs: https://docs.kernel.org/admin-guide/mm/concepts.html
    tryIt: lscpu; free -h; lsblk
  - id: operating-system
    term: operating system
    simple: >-
      The kernel plus the programs around it that run a computer for everyone:
      Windows, macOS, Android and the Machine's Alpine Linux.
    deep: >-
      An operating system starts and stops programs, shares the CPU and memory between
      them, keeps files in folders and talks to the devices, so no program has to know
      every disk ever made. Around the kernel sit an init system, a shell, a C library
      and tools; on Linux these come together as a distribution.
    sources: []
    docs: https://man7.org/linux/man-pages/man7/intro.7.html
    tryIt: cat /etc/os-release
  - id: program-process
    term: program and process
    simple: >-
      A program is instructions in a file, like `/bin/cat`; a process is a program
      running, with its own memory and a PID.
    deep: >-
      The kernel starts a program in a process with execve() and keeps one struct
      task_struct for each. One program can run as many processes at once. init is
      PID 1, and `ls /proc` shows a numbered folder for every process. Most names in
      the Machine's /bin are links to one program, BusyBox, which does the job its
      name asks for.
    sources: [fs/exec.c, include/linux/sched.h]
    docs: https://man7.org/linux/man-pages/man2/execve.2.html
    tryIt: ps -e
  - id: terminal
    term: terminal, shell and command
    simple: >-
      The terminal is the window; the shell, bash here, reads each line you type; a
      command is that line, like `ls /`.
    deep: >-
      The terminal is a device, a tty; the Machine's is the serial line ttyS0. The
      shell reads your line from it, starts the program you named and waits for it to
      finish. A few commands, like echo and pwd, the shell runs itself: builtins.
    sources: [drivers/tty/tty_io.c]
    docs: https://man7.org/linux/man-pages/man4/tty.4.html
    tryIt: tty
# No Taint rule is live in the Prologue.
taint: []
fidelity:
  faithful:
    - "a real Linux 6.18 kernel writing /proc/version as it is read"
    - "bash and BusyBox: every command prints as on Linux"
  simplified:
    - "the power-on animation is a drawing; P.4 shows the real boot"
    - "the Machine's root filesystem is not on a disk: the browser serves it to Linux over a virtio 9p share"
story:
  scene: story.md#scene
  debrief: story.md#debrief
  realWorld: story.md#real-world
