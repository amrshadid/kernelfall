# Prologue P.2, First Words (docs/levels/prologue.md). Every objective is a
# declared check: the level has no checker.ts.
id: prologue-boot-path-02-first-words
title: First Words
summary: "Watch a program ask the kernel to print, then write your first C program that asks the same way. You learn user mode and kernel mode, and that a syscall is how a program asks for anything."
minutes: 20
tracks: [userland, kernel]
skills: [sys-user-kernel-mode]
prerequisites: [sys-computer-basics]
teaches: [syscall, fd, user-kernel-mode]
# Met here, taught later: exec, C and the compiler in Act I.
names: [exec, compiler, c-basics]
uses: [kernel, process, shell]
objectives:
  - id: fixed-an-error
    text: "A build failed with an error, and a later build of `hello.c` succeeded."
    check: { kind: build-fixed }
  - id: compiles
    text: "`hello.c` compiles."
    check: { kind: compiles }
  - id: exits-zero
    text: "Running `./hello` exits with status 0."
    check: { kind: exit-status, status: 0 }
  # printf() passes too: musl's stdio hands the line to the kernel with writev(1, …).
  - id: writes-stdout
    text: "A `write` on file descriptor 1 reaches the kernel, and it returns the count you asked for."
    check: { kind: wrote, fd: 1 }
  - id: ends-in-newline
    text: "The bytes that reach the terminal end in a newline."
    check: { kind: terminal, text: { endsWith: "\n" } }
hints:
  - You want your line to reach the terminal. Every program starts with three file descriptors already open. Which one is the program's output?
  - "`write(fd, buf, count)` hands `count` bytes from `buf` to the kernel. File descriptor 1 is the program's output; here, it leads to your terminal. The kernel answers with how many bytes it took."
  - "Inside `main`, above `return 0`, add `write` with file descriptor 1, your text in double quotes, and the number of bytes in it. `\\n` is one byte: count it too."
chips:
  - { command: /bin/echo hello, explain: "the program /bin/echo prints what you give it" }
  - { command: ls /bin, explain: "list the folder /bin, where the Machine's programs live" }
  - { command: cat /etc/motd, explain: "show the file /etc/motd, init's message to the city" }
xray: [syscalls]
codex:
  - id: syscall
    term: syscall(2)
    simple: >-
      A request from a program to the kernel: show text, open a file, start a
      program. Programs have no other way to reach it.
    deep: >-
      Each syscall has a number and up to six arguments. The kernel answers with a
      value, or a negative error code that the C library turns into -1 and errno. On
      this 32-bit Machine a program enters with sysenter or the older int $0x80, at
      entry_SYSENTER_32 and entry_INT80_32 in entry_32.S: the Gate. From there
      ia32_sys_call() in syscall_32.c runs the handler numbered in eax, a switch
      statement generated from syscall_32.tbl.
    sources: [arch/x86/entry/entry_32.S, arch/x86/entry/syscall_32.c, arch/x86/entry/syscalls/syscall_32.tbl]
    docs: https://man7.org/linux/man-pages/man2/syscalls.2.html
    tryIt: strace echo hello
  - id: user-kernel-mode
    term: user mode and kernel mode
    simple: >-
      The CPU runs programs with limits on (user mode) and the kernel without them
      (kernel mode), so programs must ask.
    deep: >-
      The CPU tracks its privilege level. On x86, programs run in ring 3 and the
      kernel in ring 0; kernel memory is mapped supervisor-only, so a program that
      touches it faults. A syscall instruction is the sanctioned way up: on this
      32-bit Machine sysenter or int $0x80, with sysexit or iret the way back; on a
      64-bit PC, syscall and sysret. man 2 syscall lists the instruction for each
      architecture.
    sources: [arch/x86/entry/entry_32.S, arch/x86/entry/entry_64.S]
    docs: https://man7.org/linux/man-pages/man2/syscall.2.html
    tryIt: strace -e trace=write echo hello
  - id: file-descriptors
    term: file descriptors
    simple: >-
      Small numbers a process uses for what it has open: 0 for input, 1 for normal
      output, 2 for errors.
    deep: >-
      Each process has a table of open files; an fd is an index into it. The shell
      passes its terminal as 0, 1 and 2 to every program it starts.
    sources: [fs/file.c, include/linux/fdtable.h]
    docs: https://man7.org/linux/man-pages/man3/stdin.3.html
    tryIt: ls -l /proc/self/fd
  - id: write-syscall
    term: write(2)
    simple: >-
      Hands bytes from your program to something it has open. fd 1, standard output,
      leads to your terminal here.
    deep: >-
      ssize_t write(int fd, const void *buf, size_t count) copies up to count bytes
      from your buffer to the open file fd, and returns how many it took. It can take
      fewer than asked (a "short write"), so careful code checks the return value. The
      path: ksys_write() → vfs_write() → the file's own write function; for a
      terminal, the tty layer's tty_write(). Its sibling writev() takes several
      buffers in one call; the Machine's C library, musl, prints printf()'s text that
      way.
    sources: [fs/read_write.c, drivers/tty/tty_io.c]
    docs: https://man7.org/linux/man-pages/man2/write.2.html
    tryIt: strace -e trace=write echo hello
  - id: compiler-diagnostics
    term: compiler diagnostics
    simple: >-
      The compiler says where it stopped and why: file:line:column, how bad (error or
      warning), then the message.
    deep: >-
      An error stops the build; a warning doesn't. Under the message, gcc shows the
      source line with a ^ at the spot, sometimes a suggested fix under it, and ~
      under the code it was reading when it noticed. clang uses the same
      file:line:column: error: shape with its own wording. Fix the first error first:
      later ones are often caused by it. The kernel is built by the same compilers,
      and CONFIG_WERROR makes its build treat warnings as errors.
    sources: [Documentation/kbuild/llvm.rst, init/Kconfig]
    docs: https://gcc.gnu.org/onlinedocs/gcc/Diagnostic-Message-Formatting-Options.html
    tryIt: gcc -Wall -Wextra -o hello hello.c
# No Taint rule is live in the Prologue: compiler warnings get init's note, and
# count as Taint from 1.3, where they are taught.
taint: []
fidelity:
  faithful:
    - programs in user mode, the kernel in kernel mode, and sysenter or int $0x80 as the way in on this 32-bit Machine
    - every syscall in X-ray is one the real kernel ran, with its real arguments and answer
    - write()'s signature and return value, and writev() behind musl's printf()
    - exit_group as the syscall behind returning from main
    - fds 0, 1 and 2
    - "gcc 15's real diagnostics: file:line:column: error:, the caret line, the fix-it"
    - programs linked dynamically against musl, the Machine's C library
  simplified:
    - "the traces in the story are trimmed: they leave out the calls musl and BusyBox make to get a program ready (set_thread_area, brk, mprotect…), which X-ray shows"
story:
  scene: story.md#scene
  debrief: story.md#debrief
  realWorld: story.md#real-world
