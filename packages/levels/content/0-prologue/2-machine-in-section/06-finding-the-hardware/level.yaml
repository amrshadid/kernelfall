# Prologue P.6, Finding the Hardware (docs/levels/prologue.md). The bus question is a
# declared check; checker.ts judges the rest, none of it the player's own program.
# Registers, MMIO and interrupts are Codex cards here; Act II and III build them.
id: prologue-machine-in-section-06-finding-the-hardware
title: Finding the Hardware
summary: "Ask the Machine's PCI bus what it found and which driver took each device, then fix a small board's device tree so its lamp gets a driver. You learn how the kernel finds its hardware and matches each device to a driver."
minutes: 20
tracks: [kernel]
skills: [drv-hardware-discovery]
prerequisites: [sys-kernel-role]
teaches: [bus, sysfs, device-tree]
uses: [kernel, driver, device, hex, file-tree]
objectives:
  - id: asks-pci-bus
    text: "Ask the PCI bus what it found, and each device's driver: `lspci -k`."
    check: { kind: ran, program: lspci, args: { match: ["^-[A-Za-z]*k[A-Za-z]*$"] }, status: 0 }
  - id: reads-disk-driver
    text: "Find the disk controller's driver yourself: `readlink` its `driver` link in `/sys`."
  - id: compiles-dts
    text: "Compile the lighthouse board's device tree with `dtc`."
  - id: lamp-binds
    text: "Give the lamp its driver: `board` shows `leds-gpio` taking it."
hints:
  - "In `/sys`, a device that has a driver has a link named `driver`. For the lamp, compare two texts: its node's `compatible` and the driver's list."
  - "A node binds when its `compatible` text is one of the texts in a driver's `of_match_table`, whole and letter for letter; only upper and lower case may differ."
  - 'The `leds` node says `"gpio-led"`. The driver''s list says `"gpio-leds"`.'
chips:
  - { command: lspci, explain: "list the PCI devices; -k adds the driver each one uses" }
  - { command: cat, explain: "show a file, like one fact in /sys" }
  - { command: readlink, explain: "print where a link points, like a device's driver link in /sys" }
  - { command: dtc, explain: "the device tree compiler: -I dts -O dtb -o out.dtb in.dts" }
  - { command: board, explain: "boot the lighthouse board from a .dtb, as far as matching its drivers" }
xray: [syscalls, files]
codex:
  - id: driver-model
    term: buses, devices and drivers
    simple: >-
      A bus finds its devices and offers each to the drivers; one whose list matches
      takes it. `lspci -k` prints `Kernel driver in use: ata_piix`.
    deep: >-
      The driver model has struct bus_type, struct device and struct device_driver.
      When either side is added, the core calls the bus's match(), then the driver's
      probe(), which takes the device over, in really_probe(). PCI joins cards inside
      a PC, USB plugged-in devices, I2C a board's small chips; PCI matches the IDs in
      a driver's id_table. On most systems udev, in
      Userland, hears each new device as a uevent and loads its module by modalias;
      the Machine runs no udev.
    sources: [drivers/base/dd.c, drivers/base/bus.c, drivers/pci/pci-driver.c]
    docs: https://docs.kernel.org/driver-api/driver-model/overview.html
    tryIt: lspci -k
  - id: sysfs
    term: /sys, the devices' tree
    simple: >-
      Files the kernel fills with what it knows about devices, one fact each:
      `/sys/bus/pci/devices/0000:00:1e.0/vendor` holds `0x8086`, Intel.
    deep: >-
      sysfs is made by the kernel from its own objects, on read, like /proc.
      /sys/bus/<bus>/devices and /sys/bus/<bus>/drivers show a bus's two sides,
      /sys/devices the physical tree, /sys/class devices by kind. A bound device's
      driver entry is a symbolic link into its driver's folder. A PCI device's folder
      is named by its address: domain 0000, bus 00, slot 1e, function 0. lspci reads
      its answers from /sys/bus/pci. In 2.7 the Lantern gets files of its own here.
    sources: [fs/sysfs, drivers/base/core.c]
    docs: https://docs.kernel.org/filesystems/sysfs.html
    tryIt: ls /sys/bus/pci/devices
  - id: device-tree
    term: the device tree
    simple: >-
      A text description of a board's devices, compiled by `dtc` and handed to the
      kernel at boot. Most ARM and RISC-V boards use one.
    deep: >-
      A .dts is a tree of nodes with properties: compatible, reg for register
      addresses, links like <&gpio 4 0>, the lamp on pin 4 of a GPIO controller, a
      chip whose pins software switches. Drivers list their strings in an
      of_match_table; of_compat_cmp() compares whole strings, ignoring case. A node
      with reg becomes a device named address.node, like 7e200000.gpio. A running
      system shows its tree in /sys/firmware/devicetree/base. You write the
      lighthouse beacon's driver in 3.14.
    sources: [drivers/of, arch/arm64/boot/dts, drivers/leds/leds-gpio.c]
    docs: https://docs.kernel.org/devicetree/usage-model.html
    tryIt: "ls /proc/device-tree 2>/dev/null || echo 'no device tree: normal on a PC'"
  - id: drivers
    term: drivers
    simple: >-
      The kernel code that knows how to work one kind of device: `ata_piix` runs the
      Machine's disk controller.
    deep: >-
      Most of the kernel's code is drivers, under drivers/. A driver registers with a
      bus and is offered every matching device; it can be built in or a module.
      Without a bound driver, the kernel sees a device but can't run it. The Machine's
      display controller at 00:12.0 has one, bochs, as a module nothing loads: no udev.
    sources: [drivers, include/linux/device/driver.h]
    docs: https://docs.kernel.org/driver-api/
    tryIt: ls /sys/bus/pci/drivers
  - id: acpi-pci
    term: "finding hardware: ACPI and PCI"
    simple: >-
      On PCs, firmware tables called ACPI describe what can't announce itself, and the
      kernel asks each PCI slot for its vendor and device IDs.
    deep: >-
      The kernel's ACPI core parses the firmware's tables, the DSDT and others;
      /sys/firmware/acpi/tables shows them. Arm servers use ACPI too. PCI devices are
      found by reading each slot's configuration space in pci_scan_device(); each gets
      a struct pci_dev. A host bridge joins PCI to the CPU and memory; an ISA bridge
      leads to old PC parts like the keyboard. The Machine's firmware gives no ACPI
      tables: /sys/firmware holds only memmap. You write a PCI driver in 3.15.
    sources: [drivers/acpi, drivers/pci/probe.c, include/linux/pci.h]
    docs: https://docs.kernel.org/PCI/pci.html
    tryIt: lspci -nn
  - id: interrupts-mmio
    term: interrupts and MMIO
    simple: >-
      A driver works its device through registers, often at memory addresses; the
      device calls for attention with an interrupt. `cat /proc/interrupts` counts them.
    deep: >-
      A driver maps its device's registers with ioremap() and uses readl() and
      writel(); old PC parts use I/O ports, inb() and outb(). An interrupt makes the
      CPU jump into the kernel between two instructions and run the handler given to
      request_irq(); local_irq_disable() holds them off. Deferrable work goes to
      softirqs, run as the interrupt ends or by ksoftirqd, or to workqueues, which may
      sleep. On the Machine's XT-PIC, line 0 is the timer. Built in 2.10a–2.10c and
      3.15.
    sources: [kernel/irq, kernel/softirq.c, include/linux/io.h, arch/x86/kernel/i8259.c]
    docs: https://docs.kernel.org/core-api/genericirq.html
    tryIt: cat /proc/interrupts
# No Taint rules are live in the Prologue.
taint: []
fidelity:
  faithful:
    - "the Machine's real PCI devices, IDs and drivers as lspci -k prints them: a 1990s PC's chips, Intel's 440FX and PIIX3, emulated in the browser, and two virtio devices designed for virtual machines, with IDs Red Hat registered, the 9P transport carrying the Machine's files; rev is a chip's revision, Subsystem who built the card around it"
    - "no ACPI tables from the Machine's firmware (dmesg: no valid RSDP): /sys/firmware holds only memmap, the firmware's map of the RAM"
    - "the /sys layout and its driver links; the display controller at 00:12.0 really has no driver bound: bochs.ko is on the image but unloaded, and the kernel's VGA text console still writes to it through the old VGA ports"
    - "/proc/interrupts on one CPU, through the XT-PIC, the 8259; most PCs use an IO-APIC and MSI, and show a column per CPU"
    - "the two bridges: the 440FX is also the memory controller, and the PIIX3's ISA side holds the timer, the interrupt controllers and DMA"
    - "the device tree syntax, dtc, the gpio-leds and brcm,bcm2835-gpio compatible strings, and whole-string matching that ignores case (of_compat_cmp())"
    - "the LED child named led-0, as the leds-gpio binding asks"
    - "platform device names made from nodes (7e200000.gpio, leds) and LED names from labels"
  simplified:
    - "the lighthouse board is made up (real bindings, invented board); `board` reads a real .dtb and matches it with two drivers' real of_match_table, but runs no ARM kernel"
    - "board's probe lines are its own: the real driver core logs a binding only at debug level"
    - "the Machine's serial line ttyS1 and its interrupts carry the kernel's trace to the browser; a real PC has no such line"
story:
  scene: story.md#scene
  debrief: story.md#debrief
  realWorld: story.md#real-world
lab:
  # board.c is the lighthouse board's stand-in kernel: it reads a .dtb and matches nodes to drivers.
  files:
    - path: /usr/local/src/board.c
      content: |
        /*
         * board: boots the lighthouse board as far as its drivers. It matches each
         * device node of a .dtb against the of_match_table of the drivers the
         * board's kernel has, as the driver core does. No ARM code runs.
         */
        #define _POSIX_C_SOURCE 200809L
        #include <fcntl.h>
        #include <stdint.h>
        #include <stdio.h>
        #include <string.h>
        #include <unistd.h>

        #define FDT_MAGIC 0xd00dfeedu
        #define FDT_BEGIN_NODE 1u
        #define FDT_END_NODE 2u
        #define FDT_PROP 3u
        #define FDT_NOP 4u
        #define FDT_END 9u
        #define MAX_BLOB 65536
        #define MAX_NODES 64
        #define MAX_DEPTH 16

        struct driver {
        	const char *name;
        	const char *compatible;
        	int leds;
        };

        /* From each driver's of_match_table in Linux 6.18. */
        static const struct driver drivers[] = {
        	/* drivers/pinctrl/bcm/pinctrl-bcm2835.c */
        	{ "pinctrl-bcm2835", "brcm,bcm2835-gpio", 0 },
        	/* drivers/leds/leds-gpio.c */
        	{ "leds-gpio", "gpio-leds", 1 },
        };

        struct node {
        	const char *name;
        	int parent;
        	int depth;
        	const char *compatible;
        	uint32_t compatible_len;
        	const char *model;
        	const char *label;
        	uint32_t phandle;
        	uint32_t gpio_phandle;
        	int has_gpios;
        	int gpio_controller;
        	int has_reg;
        	uint32_t reg;
        	const struct driver *bound;
        };

        static unsigned char blob[MAX_BLOB];
        static struct node nodes[MAX_NODES];
        static int node_count;

        static uint32_t be32(const unsigned char *p)
        {
        	return (uint32_t)p[0] << 24 | (uint32_t)p[1] << 16 |
        	       (uint32_t)p[2] << 8 | (uint32_t)p[3];
        }

        /* of_compat_cmp(): the whole string, ignoring case. */
        static int same_compatible(const char *a, const char *b)
        {
        	for (; *a && *b; a++, b++) {
        		char x = (*a >= 'A' && *a <= 'Z') ? (char)(*a + 32) : *a;
        		char y = (*b >= 'A' && *b <= 'Z') ? (char)(*b + 32) : *b;

        		if (x != y)
        			return 0;
        	}
        	return *a == *b;
        }

        static const struct driver *match(const struct node *n)
        {
        	uint32_t at = 0;

        	while (at < n->compatible_len) {
        		const char *one = n->compatible + at;

        		for (size_t i = 0; i < sizeof(drivers) / sizeof(drivers[0]); i++)
        			if (same_compatible(one, drivers[i].compatible))
        				return &drivers[i];
        		at += (uint32_t)strlen(one) + 1;
        	}
        	return NULL;
        }

        static void property(struct node *n, const char *name,
        		     const unsigned char *value, uint32_t len)
        {
        	const char *text = (const char *)value;
        	int is_text = len > 0 && value[len - 1] == '\0';

        	if (!strcmp(name, "compatible") && is_text) {
        		n->compatible = text;
        		n->compatible_len = len;
        	} else if (!strcmp(name, "model") && is_text) {
        		n->model = text;
        	} else if (!strcmp(name, "label") && is_text) {
        		n->label = text;
        	} else if (!strcmp(name, "phandle") && len == 4) {
        		n->phandle = be32(value);
        	} else if (!strcmp(name, "gpio-controller")) {
        		n->gpio_controller = 1;
        	} else if (!strcmp(name, "reg") && len >= 4) {
        		n->has_reg = 1;
        		n->reg = be32(value);
        	} else if (!strcmp(name, "gpios") && len >= 8) {
        		n->has_gpios = 1;
        		n->gpio_phandle = be32(value);
        	}
        }

        static int parse(size_t size)
        {
        	uint32_t total, off_struct, off_strings, size_strings, at;
        	int stack[MAX_DEPTH];
        	int depth = 0;

        	if (size < 40 || be32(blob) != FDT_MAGIC)
        		return -1;
        	total = be32(blob + 4);
        	off_struct = be32(blob + 8);
        	off_strings = be32(blob + 12);
        	size_strings = be32(blob + 32);
        	if (total > size || off_struct >= total || off_strings > total ||
        	    size_strings > total - off_strings)
        		return -1;
        	at = off_struct;
        	while (at + 4 <= total) {
        		uint32_t token = be32(blob + at);

        		at += 4;
        		if (token == FDT_BEGIN_NODE) {
        			const char *name = (const char *)blob + at;
        			size_t len = strnlen(name, total - at);
        			struct node *n;

        			if (at + len >= total || node_count == MAX_NODES ||
        			    depth == MAX_DEPTH)
        				return -1;
        			n = &nodes[node_count];
        			memset(n, 0, sizeof(*n));
        			n->name = name;
        			n->depth = depth;
        			n->parent = depth ? stack[depth - 1] : -1;
        			stack[depth++] = node_count++;
        			at += ((uint32_t)len + 1 + 3) & ~3u;
        		} else if (token == FDT_END_NODE) {
        			if (depth == 0)
        				return -1;
        			depth--;
        		} else if (token == FDT_PROP) {
        			uint32_t len, name_off;

        			if (depth == 0 || at + 8 > total)
        				return -1;
        			len = be32(blob + at);
        			name_off = be32(blob + at + 4);
        			at += 8;
        			if (len > total - at || name_off >= size_strings)
        				return -1;
        			property(&nodes[stack[depth - 1]],
        				 (const char *)blob + off_strings + name_off,
        				 blob + at, len);
        			at += (len + 3) & ~3u;
        		} else if (token == FDT_END) {
        			return depth == 0 && node_count > 0 ? 0 : -1;
        		} else if (token != FDT_NOP) {
        			return -1;
        		}
        	}
        	return -1;
        }

        /* of_device_make_bus_id(): "<address>.<name>", or the name alone. */
        static void device_name(const struct node *n, char *buf, size_t size)
        {
        	const char *at = strchr(n->name, '@');
        	int len = (int)(at ? (size_t)(at - n->name) : strlen(n->name));

        	if (n->has_reg)
        		snprintf(buf, size, "%x.%.*s", (unsigned int)n->reg, len,
        			 n->name);
        	else
        		snprintf(buf, size, "%.*s", len, n->name);
        }

        static const struct node *by_phandle(uint32_t phandle)
        {
        	for (int i = 0; i < node_count; i++)
        		if (phandle && nodes[i].phandle == phandle)
        			return &nodes[i];
        	return NULL;
        }

        /* leds-gpio's probe: an LED for each child node with a gpios line. */
        static int probe_leds(int parent, const char **names, int *count)
        {
        	int found = 0;

        	for (int i = 0; i < node_count; i++) {
        		const struct node *led = &nodes[i];
        		const struct node *gpio;

        		if (led->parent != parent || !led->has_gpios)
        			continue;
        		gpio = by_phandle(led->gpio_phandle);
        		if (!gpio || !gpio->gpio_controller || !gpio->bound)
        			return -1;
        		if (*count < MAX_NODES)
        			names[(*count)++] = led->label ? led->label : led->name;
        		found++;
        	}
        	return found;
        }

        int main(int argc, char **argv)
        {
        	const char *leds[MAX_NODES];
        	int led_count = 0;
        	size_t size = 0;
        	ssize_t n;
        	int fd;

        	if (argc != 2) {
        		fprintf(stderr, "usage: board <file.dtb>\n");
        		return 2;
        	}
        	fd = open(argv[1], O_RDONLY);
        	if (fd < 0) {
        		perror(argv[1]);
        		return 1;
        	}
        	while ((n = read(fd, blob + size, sizeof(blob) - size)) > 0)
        		size += (size_t)n;
        	if (n < 0) {
        		perror("read");
        		close(fd);
        		return 1;
        	}
        	if (close(fd) < 0) {
        		perror("close");
        		return 1;
        	}
        	if (parse(size) < 0) {
        		fprintf(stderr, "board: %s: not a device tree blob\n", argv[1]);
        		return 1;
        	}
        	printf("OF: fdt: Machine model: %s\n",
        	       nodes[0].model ? nodes[0].model : "unknown");
        	for (int i = 0; i < node_count; i++) {
        		struct node *dev = &nodes[i];
        		char name[64];

        		if (dev->depth != 1 || !dev->compatible)
        			continue;
        		device_name(dev, name, sizeof(name));
        		dev->bound = match(dev);
        		if (!dev->bound) {
        			printf("%s: no driver matches \"%s\"\n", name,
        			       dev->compatible);
        			continue;
        		}
        		if (dev->bound->leds && probe_leds(i, leds, &led_count) <= 0) {
        			printf("%s %s: probe failed: no LED to light\n",
        			       dev->bound->name, name);
        			dev->bound = NULL;
        			continue;
        		}
        		printf("%s %s: probed\n", dev->bound->name, name);
        	}
        	printf("/sys/class/leds:");
        	for (int i = 0; i < led_count; i++)
        		printf(" %s", leds[i]);
        	printf("%s\n", led_count ? "" : " (none)");
        	return 0;
        }
  bin: [board]
