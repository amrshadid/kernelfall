# Prologue P.9, Files, Doors and Wires (docs/levels/prologue.md). Objectives
# without a `check` are judged in checker.ts.
id: prologue-machine-in-section-09-files-doors-wires
title: Files, Doors and Wires
summary: "Read one of the Machine's files, a number the kernel works out and a device's setting, all with one small program. You learn filesystems, device files and the network, and why on Linux almost everything is a file."
minutes: 25
tracks: [userland, kernel]
skills: [io-everything-is-a-file, sys-kernel-subsystems]
prerequisites: [drv-hardware-discovery, mem-virtual-memory-basics]
objectives:
  - id: exits-zero
    text: "`./look` exits with status 0."
    check: { kind: exit-status, status: 0, program: look }
  - id: reads-9p
    text: "`./look` reads one of the Machine's own files, served by 9p at `/`, like `/etc/motd`, and writes it to standard output."
  - id: reads-procfs
    text: "`./look` reads a file in `/proc` (procfs), like `/proc/uptime`, and writes it to standard output."
  - id: reads-sysfs
    text: "`./look` reads a file in `/sys` (sysfs), like `/sys/class/net/eth0/address`, and writes it to standard output."
hints:
  - "The program reads whatever `path` names. What should it name for the `/proc` run?"
  - "`/proc` and `/sys` files are opened and read exactly like the Machine's other files. Only the path changes."
  - 'Change the text to `"/proc/uptime"`, run, then to `"/sys/class/net/eth0/address"`, run.'
chips:
  - { command: cat, explain: "show a file: /proc/mounts lists every mounted filesystem" }
  - { command: ls, explain: "ls -l /dev/null /dev/tty /dev/sda shows device files: c or b, major and minor" }
  - { command: dmesg, explain: "the kernel's own log, from the first line of the boot" }
xray: [syscalls, files, network]
codex:
  - id: vfs
    term: "the VFS: everything is a file"
    deepens: write-syscall
    simple: >-
      One set of calls (open, read, write, close) works on ordinary files, /proc, /sys
      and devices; the VFS hands each to the right code.
    deep: >-
      An open file is a struct file pointing at an inode and a table of functions,
      struct file_operations; vfs_read() calls the file's read_iter (or read). Each
      filesystem or driver supplies its own table: v9fs_file_read_iter() for the
      Machine's 9p root, proc_reg_read_iter() for /proc, kernfs_fop_read_iter() for
      /sys. sendfile() copies between two files inside the kernel, through the same
      tables.
    sources: [fs/read_write.c, include/linux/fs.h, fs/9p/vfs_file.c, fs/proc/inode.c, fs/kernfs/file.c]
    docs: https://docs.kernel.org/filesystems/vfs.html
    tryIt: strace -e trace=open,sendfile64 cat /proc/uptime
  - id: filesystems
    term: filesystems and mounts
    deepens: files
    simple: >-
      Different filesystems (ext4 on a disk, 9p over a share, procfs, sysfs,
      devtmpfs, tmpfs) are attached into one tree; /proc/mounts lists them.
    deep: >-
      Each filesystem registers a struct file_system_type; mounting attaches its root
      at a directory. ext4 stores files on a block device; 9p asks a server over a
      transport (on the Machine, virtio); tmpfs keeps files in memory; procfs, sysfs
      (built on kernfs) and devtmpfs make their contents in the kernel. A filesystem
      on a disk is in the tree only once it is mounted.
    sources: [fs/namespace.c, fs/ext4, fs/9p, fs/proc, fs/sysfs, fs/kernfs, drivers/base/devtmpfs.c]
    docs: https://man7.org/linux/man-pages/man5/proc_mounts.5.html
    tryIt: cat /proc/mounts
  - id: device-files
    term: device files
    deepens: drivers
    simple: >-
      Files in /dev are doors into drivers: c for character devices, b for block
      devices, with major and minor numbers.
    deep: >-
      A device node holds a dev_t (major, minor). Opening it finds the driver
      registered for that number (a cdev for character devices), whose
      file_operations then serve every call. devtmpfs creates nodes as drivers
      register devices, owned by root; on most systems udev then sets owners, modes
      and names (the Machine runs none). Block major 8 is the SCSI disk driver, sd.
    sources: [fs/char_dev.c, drivers/char/mem.c, drivers/base/devtmpfs.c, drivers/scsi/sd.c]
    docs: https://man7.org/linux/man-pages/man4/null.4.html
    tryIt: ls -l /dev/null /dev/tty
  - id: network-stack
    term: the network stack
    simple: >-
      Programs talk through sockets; the kernel turns data into TCP or UDP segments,
      IP packets and frames for the network card.
    deep: >-
      A socket is a file descriptor; under it, net/ipv4/tcp*.c and
      net/ipv4/ip_output.c build packets as struct sk_buff, netfilter hooks inspect
      them, and the driver's ndo_start_xmit() sends them. Interfaces show in
      /sys/class/net, counters in /proc/net/dev. The Machine's card is a virtio
      network device, run by virtio_net.
    sources: [net/socket.c, net/ipv4, net/netfilter, drivers/net/virtio_net.c]
    docs: https://man7.org/linux/man-pages/man7/socket.7.html
    tryIt: ls /sys/class/net; cat /proc/net/dev
  - id: printk-dmesg
    term: printk and dmesg
    simple: >-
      The kernel's own log: messages from boot and from drivers, read with dmesg.
    deep: >-
      printk() (and pr_info(), dev_info()…) writes into a ring buffer with a log
      level. util-linux's dmesg reads it from /dev/kmsg; BusyBox's, the Machine's,
      with the syslog() syscall (klogctl). Many distributions set
      kernel.dmesg_restrict to 1 so only root may read it; the Machine leaves it 0.
    sources: [kernel/printk/printk.c, include/linux/printk.h]
    docs: https://man7.org/linux/man-pages/man1/dmesg.1.html
    tryIt: dmesg | tail -n 20
  - id: kernel-source-tree
    term: the kernel source tree
    simple: >-
      Each part of the kernel has its folder: kernel/, mm/, fs/, net/, drivers/,
      arch/, include/, init/, ipc/, security/.
    deep: >-
      arch/<cpu>/ holds what differs per CPU type (entry code, page tables, boot);
      kernel/ the core (processes, scheduler, signals, modules, printk, locking); mm/
      memory; fs/ the VFS and filesystems; net/ networking; drivers/ most of the code;
      include/linux internal headers and include/uapi the user-space interface; init/
      start-up; ipc/ System V and POSIX IPC; security/ LSMs and capabilities;
      Documentation/ the docs.
    sources: [kernel, mm, fs, net, drivers, arch, include, init, ipc, security, Documentation]
    docs: https://elixir.bootlin.com/linux/v6.18/source
    tryIt: ls /lib/modules/$(uname -r)/kernel
# No Taint rules are live in the Prologue.
taint: []
fidelity:
  faithful:
    - "the Machine's real /proc/mounts: 9p at /, procfs, sysfs, devtmpfs, devpts, tmpfs, tracefs"
    - "the VFS function names for 9p, procfs and sysfs reads, as init names them"
    - "sysfs's address file printing the address virtio_net stored at probe (dev_addr)"
    - "the /dev modes, c and b, majors and minors, as devtmpfs makes them with no udev"
    - "/sys/class/net with eth0 (virtio_net) and lo, and /proc/net/dev"
    - "cat's open and sendfile64; look's open, read and write, with musl's O_LARGEFILE"
    - "printk's ring buffer, read by BusyBox dmesg with syslog()"
    - the source tree's layout
  simplified:
    - "X-ray shows look's syscalls, not which filesystem's code answered them: the routing under the VFS is init's explanation, not something the trace shows"
    - "the network trip is a drawing; packets are built later, in Socket Harbor"
    - "eth0 has no network behind it: the browser gives the Machine no wire yet"
story:
  scene: story.md#scene
  debrief: story.md#debrief
  realWorld: story.md#real-world
