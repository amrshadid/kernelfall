# Prologue P.10, Bring the Machine Up (docs/levels/prologue.md): the Prologue's
# capstone, never skipped. It teaches nothing new: the player reads a stopped boot in
# the initramfs's emergency shell, fixes the entry in GRUB and proves the Machine is
# fully up. Objectives without a `check` are judged in checker.ts.
id: prologue-machine-in-section-10-bring-it-up
title: Bring the Machine Up
summary: "Someone broke the Machine's boot entry. Read where the boot stopped, fix the entry in GRUB and bring the Machine fully up: its root, its network card, all its memory and its first processes. You use everything the Prologue taught, together."
minutes: 30
tracks: [kernel, userland]
skills: [sys-command-lifecycle]
prerequisites: [sys-kernel-subsystems, sys-boot-chain]
objectives:
  # Only a boot that found its root reaches bash, where this read happens.
  - id: root-found
    text: "The Machine reaches your shell, and `cat /proc/cmdline` shows a command line without `root=/dev/sda3`."
    check: { kind: read-to-end, program: cat, path: /proc/cmdline, text: { notContains: root=/dev/sda3 } }
  - id: card-bound
    text: "The network card's `driver` link, `/sys/class/net/eth0/device/driver`, points at `virtio_net`."
  - id: full-memory
    text: "`/proc/meminfo` (or `free`) shows more than 200 MiB in total: no `mem=` limit."
  - id: processes-listed
    text: "`ps` lists init as PID 1, with the kernel threads beside it."
  - id: operstate-up
    text: "Once init has raised the link, `cat /sys/class/net/eth0/operstate` prints `up`."
    check: { kind: read-to-end, program: cat, path: /sys/class/net/eth0/operstate, text: { equals: "up\n" } }
# Raising a link needs root: as `you`, `ip link set eth0 up` fails with EPERM.
runAs:
  - { after: card-bound, user: root, command: ip link set eth0 up }
hints:
  - "The Machine stopped before init could start. What did its last lines name, and what does `cat /proc/cmdline` say the kernel was told?"
  - "`root=` names the root filesystem: the Machine's is the share `host9p`, which its initramfs mounts when there's no `root=` at all. `module_blacklist=` makes the kernel refuse a module, and `mem=` makes it use only that much RAM. Once bash runs you're not root and can't restart, so fix the whole line in one edit."
  - "Type `reboot -f` in the emergency shell. At GRUB, press `e`, go to the end of the `linux` line, delete `root=/dev/sda3 module_blacklist=virtio_net mem=64M`, then press Ctrl-X."
chips:
  - { command: cat, explain: "show a file: /proc/cmdline holds what the kernel was told" }
  - { command: ls, explain: "list a folder: /dev, /sys/class/net" }
  - { command: free, explain: "how much memory the kernel has, used and free" }
  - { command: reboot, explain: "restart the Machine (-f: at once, without asking init)" }
  - { command: readlink, explain: "print where a link points" }
  - { command: ps, explain: "list the processes" }
xray: [boot, syscalls, processes, files]
codex:
  - id: command-lifecycle
    term: the life of a command
    simple: >-
      A command travels from the shell through the kernel's parts to a driver and
      back: new process, program loaded, path walked, data read, text written, exit,
      prompt.
    deep: >-
      fork() (clone() with glibc) → kernel_clone(); execve() → do_execveat_common();
      the scheduler runs the new task; open() (openat() with glibc) → path_openat();
      read() → vfs_read() → the filesystem (for a disk file on ext4, the page cache,
      and on a miss the block layer and the disk driver; for sysfs,
      kernfs_fop_read_iter() and a driver's attribute); BusyBox cat copies with
      sendfile64() → do_splice_direct(), through the same read code; write() →
      tty_write(); exit_group() → do_exit(), SIGCHLD to the parent; wait4() →
      do_wait().
    sources:
      - kernel/fork.c
      - fs/exec.c
      - fs/namei.c
      - fs/read_write.c
      - fs/splice.c
      - fs/kernfs/file.c
      - net/core/net-sysfs.c
      - drivers/tty/tty_io.c
      - kernel/exit.c
    docs: https://man7.org/linux/man-pages/man2/execve.2.html
    tryIt: "strace -f -e trace=fork,clone,execve,open,openat,read,write,sendfile64,wait4 sh -c 'cat /sys/class/net/lo/operstate; true'"
  - id: boot-parameters-that-break
    term: "root=, module_blacklist= and mem="
    simple: >-
      Three boot settings: where the root filesystem is, which modules the kernel
      must refuse, and how much RAM it may use.
    deep: >-
      root= is read by the initramfs's /init (or, with no initramfs, by the kernel
      itself in prepare_namespace()). module_blacklist= is a comma-separated list the
      kernel checks before it loads a module (blacklisted(), early in load_module()),
      so the load fails with EPERM. mem= caps the RAM the kernel uses at that size (on x86,
      parse_memopt() trims the firmware's memory map).
    sources:
      [init/do_mounts.c, kernel/module/main.c, arch/x86/kernel/e820.c, Documentation/admin-guide/kernel-parameters.txt]
    docs: https://docs.kernel.org/admin-guide/kernel-parameters.html
    tryIt: cat /proc/cmdline
# No Taint rules are live in the Prologue.
taint: []
fidelity:
  faithful:
    - "GRUB 2.14's menu, editor and command line, and its names for the disk: (hd0) (hd0,msdos1)"
    - "an edit made with e in GRUB lasts one boot"
    - "module_blacklist= making the kernel refuse virtio_net (modprobe: Operation not permitted)"
    - "mem=64M leaving the kernel 45524 kB in total"
    - "reboot and ip link set needing root"
    - "eth0's operstate going from down to up when root raises the link"
  simplified:
    - "the Machine's initramfs /init is a short script written for the game, modelled on Alpine's; its messages are its own"
    - "the Machine's start-up script loads virtio_net with modprobe; on most systems udev loads it from the card's modalias"
    - "init raises eth0 for you, as root, through the game's control channel; on a real system a network manager or ifup does it at boot"
    - "eth0 has no network behind it: once it's up, v86 reports a link, and its frames go nowhere"
story:
  scene: story.md#scene
  debrief: story.md#debrief
  realWorld: story.md#real-world
lab:
  # The boot entry someone changed: written into grub.cfg on /dev/sda1, so the Machine
  # starts on it until the player fixes it with `e`, for that boot.
  boot:
    args: console=ttyS0 rw tsc=reliable mitigations=off random.trust_cpu=on log_buf_len=128K quiet root=/dev/sda3 module_blacklist=virtio_net mem=64M
