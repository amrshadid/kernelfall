# Surface Survey S.3, Processes from Outside (docs/levels/surface-survey.md).
# Every objective is judged in checker.ts.
id: prologue-surface-survey-03-processes
title: Processes from Outside
summary: "Find two running programs with ps and /proc, pause and resume one with signals, then end both, and find out why you may not signal init. You learn process states and how kill decides who may signal whom."
minutes: 20
tracks: [userland]
skills: [proc-observe]
prerequisites: [io-permissions, proc-process-basics]
objectives:
  - id: listed-both
    text: "`ps` lists init's two processes, `sleep` and `yes`, each with its PID."
  - id: read-status
    text: "You read the `/proc/<pid>/status` of `sleep` or `yes`, a process you didn't start."
  - id: paused-yes
    text: "`kill -STOP` pauses `yes`: `ps` or its `/proc/<pid>/status` shows state `T`, stopped."
  - id: saw-pending
    text: "`SIGTERM` sent to paused `yes` waits: its status shows `ShdPnd` as `0000000000004000`."
  - id: yes-ended
    text: "`yes` ends: `ps`, with its `COMMAND` column, shows it as a zombie, `Z`, or no longer lists it."
  - id: sleep-ended
    text: "`sleep` ends: `ps`, with its `COMMAND` column, no longer lists it."
  - id: kill-init-denied
    text: "`kill 1` fails with `Operation not permitted`: you may signal only your own processes."
hints:
  - Which column of `ps` says whether a process is paused? And which one gives the number `kill` needs?
  - "`kill -STOP PID` pauses, `kill -CONT PID` resumes, `kill PID` asks it to end. A paused process acts on signals only once it's resumed, except `SIGKILL`."
  - "Find `yes`'s PID in `ps -o pid,stat,comm`. `kill -STOP` it, `kill` it, `cat` its `/proc/<pid>/status`, then `kill -CONT` it."
xray: [processes, syscalls]
codex:
  - id: process-states
    term: process states
    deepens: process
    simple: >-
      A process is running or ready (R), sleeping (S), stopped (T) or a zombie (Z).
      ps and /proc/<pid>/status show it.
    deep: >-
      The state lives in task_struct->__state; /proc prints it from a fixed table of
      letters, task_state_array. D is an uninterruptible sleep (waiting on I/O),
      which even SIGKILL can't end until it wakes. A zombie has exited and waits for
      its parent to collect its exit status. I is an idle kernel thread, waiting for
      work (TASK_IDLE), which isn't counted in the load average. ps may add detail
      letters after the state: BusyBox's W marks a task with no user address space at
      all (its VSZ is 0), like the kernel's threads; < a raised priority (a negative
      nice value), N a lowered one.
    sources: [fs/proc/array.c, include/linux/sched.h]
    docs: https://man7.org/linux/man-pages/man5/proc_pid_status.5.html
    tryIt: ps -o pid,ppid,user,stat,time,comm
  - id: sending-signals
    term: sending signals (kill)
    deepens: signals
    simple: >-
      kill sends a signal to a process: SIGTERM asks it to end, SIGKILL ends it,
      SIGSTOP and SIGCONT pause and resume it.
    deep: >-
      kill(2) checks that the sender may signal the target, check_kill_permission():
      the same user, or the CAP_KILL capability; otherwise EPERM. SIGKILL and
      SIGSTOP can't be caught or ignored. A stopped task keeps other signals pending
      (ShdPnd in its status, one bit per signal) until SIGCONT; SIGKILL wakes it. On
      x86, 32- and 64-bit alike: SIGKILL 9, SIGTERM 15, SIGCONT 18, SIGSTOP 19.
    sources: [kernel/signal.c, arch/x86/include/uapi/asm/signal.h]
    docs: https://man7.org/linux/man-pages/man7/signal.7.html
    tryIt: "sleep 600 & kill -STOP $!; ps -o pid,stat,comm; kill -CONT $!; kill $!"
taint: []
fidelity:
  faithful:
    - "BusyBox's ps and bash's kill on the real kernel: states, PIDs and errors as the Machine prints them"
    - "signal numbers on x86 and their default actions"
    - SIGKILL and SIGSTOP can't be caught
    - "a pending SIGTERM on a stopped task (ShdPnd), acted on after SIGCONT"
    - EPERM when signalling another user's process
    - "/proc/<pid>/status's State, PPid and ShdPnd lines"
  simplified:
    - "setup starts sleep and yes as you and leaves them to init, as if init had started them"
story:
  scene: story.md#scene
  debrief: story.md#debrief
  realWorld: story.md#real-world
lab:
  # No fixed pids: the player reads them from ps. A day's sleep never ends by itself.
  processes:
    - { argv: [sleep, "86400"] }
    - { argv: ["yes"], stdout: /dev/null }
