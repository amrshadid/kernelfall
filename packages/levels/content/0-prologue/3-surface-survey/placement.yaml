# The Survey's placement check (docs/levels/surface-survey.md#placement-check), offered
# at the edge of init's street after P.10: one errand per level, done in bash, each
# judged by its level's own objectives.
offer: Know your way around? Show me, and walk on.
minutes: 7
tasks:
  - level: 01-streets
    task: "Make `/tmp/survey/maps` with one `mkdir`, copy `/etc/motd` into it, show with `ls -i` that the copy is a new file, and rename the copy `motd.old`."
    objectives: [mkdir-parents, copy-new-inode, rename-no-bytes]
  - level: 02-who-may-enter
    task: "Make `notes.txt` readable by you only, and show it with `ls -l`."
    objectives: [note-private]
  - level: 03-processes
    task: "Find init's `yes` process, pause it and show it paused, then end it."
    objectives: [paused-yes, yes-ended]
  - level: 04-finding-things
    task: "Find the file `lantern-plan.txt` somewhere under `/home/you/attic`."
    objectives: [found-plan]
  - level: 05-text-tools
    task: "Print how many lines of `census.txt` contain `dark`."
    objectives: [counted-dark]
