id: clockwork-court
name: Clockwork Court
caption: threads, the EEVDF scheduler, kernel threads
source: kernel/sched/, kernel/kthread.c
guide: the Judge, kthreadd
slots:
  - {
      number: "3.6",
      title: Many Hands,
      summary: "Add a thread to your chat server that writes its log in the background. You learn threads, mutexes and condition variables.",
    }
  - {
      number: "3.7",
