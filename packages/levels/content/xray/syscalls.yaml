# What X-ray knows about each syscall beyond the lab's trace. A syscall that isn't
# here still shows, with its raw arguments and its entry point; add it here to
# explain it. Names, numbers and functions follow the Machine: Linux 6.18 on 32-bit
# x86, whose table is arch/x86/entry/syscalls/syscall_32.tbl.
#
#   family    which storyboard it gets: write, exit, execve, fork or wait. Left out: the
#             shared one for every other call.
#   args      argument names as in the kernel's SYSCALL_DEFINE, in register order
#   pointers  arguments that are user-space addresses, printed in hex
#   pathArg   the argument that is a path, shown with the call
#   path      the kernel functions after ia32_sys_call, outermost first: the 32-bit
#             wrapper, `__ia32_` + the table's entry point (arch/x86/include/asm/syscall_wrapper.h)
#   sources   the files (and functions) the handler is checked against
#   desk      one plain sentence for "In the kernel now" at Simple
#   returns   what a successful return value is, for the narration

write:
  family: write
  args: [fd, buf, count]
  pointers: [1]
  path: [__ia32_sys_write, ksys_write, vfs_write]
  sources:
    - { path: fs/read_write.c, fn: "ksys_write(), vfs_write()" }
  desk: Writes your bytes to an open file
  returns: the number of bytes written

read:
  args: [fd, buf, count]
  pointers: [1]
  path: [__ia32_sys_read, ksys_read, vfs_read]
  sources:
    - { path: fs/read_write.c, fn: "ksys_read(), vfs_read()" }
  desk: Reads bytes from an open file into your buffer

exit_group:
  family: exit
  args: [error_code]
  path: [__ia32_sys_exit_group, do_group_exit, do_exit]
  sources:
    - { path: kernel/exit.c, fn: "do_group_exit(), do_exit()" }
  desk: Ends the process

exit:
  family: exit
  args: [error_code]
  path: [__ia32_sys_exit, do_exit]
  sources:
    - { path: kernel/exit.c, fn: do_exit() }
  desk: Ends the calling thread

execve:
  family: execve
  args: [filename, argv, envp]
  pointers: [0, 1, 2]
  pathArg: 0
  path: [__ia32_sys_execve, do_execveat_common, bprm_execve, load_elf_binary]
  sources:
    - { path: fs/exec.c, fn: "do_execveat_common(), bprm_execve(), begin_new_exec()" }
    - { path: fs/binfmt_elf.c, fn: load_elf_binary() }
  desk: Replaces the program in this process

clone:
  family: fork
  # 32-bit x86 selects CLONE_BACKWARDS: tls comes before child_tidptr.
  args: [clone_flags, newsp, parent_tidptr, tls, child_tidptr]
  pointers: [1, 2, 4]
  path: [__ia32_sys_clone, kernel_clone, copy_process]
  sources:
    - { path: kernel/fork.c, fn: "kernel_clone(), copy_process()" }
  desk: Makes a copy of this process
  returns: the new child's PID

fork:
  family: fork
  args: []
  path: [__ia32_sys_fork, kernel_clone, copy_process]
  sources:
    - { path: kernel/fork.c, fn: "kernel_clone(), copy_process()" }
  desk: Makes a copy of this process
  returns: the new child's PID

vfork:
